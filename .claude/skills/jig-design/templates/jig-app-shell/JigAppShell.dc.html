<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Jig app shell" description="Full-width workspace: sticky header, collapsible multi-tier sidebar, content, footer" -->
<helmet>
<script src="./ds-base.js"></script>
</helmet>
<div class="hlm-shell" data-collapsed="{{ collapsedAttr }}" style="font-family:var(--font-sans)">
  <aside class="hlm-sidebar">
    <div class="hlm-sidebar__header">
      <span class="hlm-sidebar__brand-mark">J</span>
      <span class="hlm-sidebar__brand-name">jig</span>
    </div>
    <nav class="hlm-sidebar__body">
      <div>
        <div class="hlm-nav__group-label">Platform</div>
        <button type="button" class="hlm-nav__item" data-active="true">
          <span class="hlm-nav__label">Overview</span>
        </button>
        <button type="button" class="hlm-nav__item" data-open="true">
          <span class="hlm-nav__label">Features</span>
          <span class="hlm-nav__badge">3</span>
          <svg class="hlm-nav__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
        </button>
        <div class="hlm-nav__sub">
          <button type="button" class="hlm-nav__item" data-active="true"><span class="hlm-nav__label">users</span></button>
          <button type="button" class="hlm-nav__item"><span class="hlm-nav__label">billing</span><span class="hlm-nav__badge">new</span></button>
          <button type="button" class="hlm-nav__item"><span class="hlm-nav__label">audit log</span></button>
        </div>
      </div>
      <div>
        <div class="hlm-nav__group-label">Build</div>
        <button type="button" class="hlm-nav__item"><span class="hlm-nav__label">Terminal</span></button>
        <button type="button" class="hlm-nav__item"><span class="hlm-nav__label">Settings</span>
          <svg class="hlm-nav__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
        </button>
      </div>
    </nav>
    <div class="hlm-sidebar__footer">
      <button type="button" class="hlm-nav__item"><span class="hlm-nav__label">satish@jig.dev</span></button>
    </div>
  </aside>

  <header class="hlm-shell__header">
    <button type="button" class="hlm-btn hlm-btn--ghost hlm-btn--icon" onClick="{{ toggle }}" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M9 3v18"></path></svg>
    </button>
    <input class="hlm-input" placeholder="Search users, features…" style="max-width:320px" />
    <span class="hlm-kbd">Ctrl K</span>
    <div style="flex:1"></div>
    <button type="button" class="hlm-btn hlm-btn--outline hlm-btn--sm">main</button>
    <span style="display:grid;place-items:center;width:28px;height:28px;border-radius:9999px;background:var(--secondary);font-size:12px;font-weight:600">SK</span>
  </header>

  <main class="hlm-shell__main">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px">
      <div>
        <div style="display:flex;align-items:center;gap:10px">
          <h1 style="font-size:var(--text-2xl)">users</h1>
          <span class="hlm-badge hlm-badge--outline">worked slice</span>
        </div>
        <p style="color:var(--muted-foreground);margin-top:4px">The one vertical slice that exercises every layer end to end.</p>
      </div>
      <button type="button" class="hlm-btn hlm-btn--default">New user</button>
    </div>

    <div class="hlm-card" style="padding-block:0;gap:0;overflow:hidden">
      <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;padding:12px 16px;font-size:12px;font-weight:500;color:var(--muted-foreground);border-bottom:1px solid var(--border)">
        <div>User</div><div>Role</div><div>Status</div>
      </div>
      <sc-for list="{{ users }}" as="u" hint-placeholder-count="4">
        <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;padding:12px 16px;align-items:center;border-top:1px solid var(--border)">
          <div>
            <div style="font-size:14px;font-weight:500">{{ u.name }}</div>
            <div style="font-size:12px;color:var(--muted-foreground);font-family:var(--font-mono)">{{ u.email }}</div>
          </div>
          <div style="font-size:14px">{{ u.role }}</div>
          <div><span class="hlm-badge hlm-badge--secondary">{{ u.status }}</span></div>
        </div>
      </sc-for>
    </div>
  </main>

  <footer class="hlm-shell__footer">
    <span class="hlm-kbd">IPC</span>
    <span>Connected to Rust core · thick client</span>
    <div style="flex:1"></div>
    <span>v0.4.0</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { collapsed: false };
  renderVals() {
    return {
      collapsedAttr: this.state.collapsed ? 'true' : 'false',
      toggle: () => this.setState((s) => ({ collapsed: !s.collapsed })),
      users: [
        { name: 'Satish Krishna', email: 'satish@jig.dev', role: 'Owner', status: 'Active' },
        { name: 'Ada Lovelace', email: 'ada@jig.dev', role: 'Maintainer', status: 'Active' },
        { name: 'Grace Hopper', email: 'grace@jig.dev', role: 'Contributor', status: 'Invited' },
        { name: 'Alan Turing', email: 'alan@jig.dev', role: 'Contributor', status: 'Suspended' },
      ],
    };
  }
}
</script>
</body>
</html>
