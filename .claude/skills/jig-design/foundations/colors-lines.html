<!-- @dsCard group="Colors" viewport="700x150" name="Lines & focus" subtitle="border · input · ring — the UI is built on hairlines, not shadow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;display:flex;gap:12px;flex-wrap:wrap;font-family:var(--font-sans)}
  .sw{width:180px}
  .chip{height:52px;border-radius:var(--radius-md);background:var(--background)}
  .n{font-size:12px;font-weight:500;margin-top:6px}
  .v{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);margin-top:1px}
</style></head><body>
  <div class="sw"><div class="chip" style="border:1px solid var(--border)"></div><div class="n">border</div><div class="v">0.922 0 0</div></div>
  <div class="sw"><div class="chip" style="border:1px solid var(--input)"></div><div class="n">input</div><div class="v">0.922 0 0</div></div>
  <div class="sw"><div class="chip" style="border:1px solid var(--border);box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 50%,transparent)"></div><div class="n">ring (focus)</div><div class="v">0.708 0 0</div></div>
</body></html>
