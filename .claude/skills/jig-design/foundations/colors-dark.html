<!-- @dsCard group="Colors" viewport="700x170" name="Dark mode" subtitle="The same aliases under `.dark` — neutral, near-black surfaces" -->
<!DOCTYPE html><html class="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html.dark body{margin:0;padding:16px;background:var(--background);display:flex;gap:12px;flex-wrap:wrap;font-family:var(--font-sans)}
  .sw{width:150px}
  .chip{height:52px;border-radius:var(--radius-md);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500}
  .n{font-size:12px;font-weight:500;margin-top:6px;color:var(--foreground)}
  .v{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);margin-top:1px}
</style></head><body>
  <div class="sw"><div class="chip" style="background:var(--background);color:var(--foreground)">Aa</div><div class="n">background</div><div class="v">0.145 0 0</div></div>
  <div class="sw"><div class="chip" style="background:var(--card);color:var(--card-foreground)">Aa</div><div class="n">card</div><div class="v">0.205 0 0</div></div>
  <div class="sw"><div class="chip" style="background:var(--primary);color:var(--primary-foreground)">Aa</div><div class="n">primary</div><div class="v">0.922 0 0</div></div>
  <div class="sw"><div class="chip" style="background:var(--muted);color:var(--muted-foreground)">Aa</div><div class="n">muted</div><div class="v">0.269 0 0</div></div>
</body></html>
