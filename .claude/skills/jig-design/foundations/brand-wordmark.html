<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;font-family:var(--font-sans);color:var(--foreground);display:flex;align-items:center;gap:20px}
  .mark{display:grid;place-items:center;width:56px;height:56px;border-radius:var(--radius-lg);background:var(--primary);color:var(--primary-foreground);font-family:var(--font-mono);font-weight:700;font-size:28px}
  .name{font-size:34px;font-weight:600;letter-spacing:-0.02em}
  .tag{font-size:13px;color:var(--muted-foreground);margin-top:2px}
</style></head><body>
  <div class="mark">J</div>
  <div>
    <div class="name">jig</div>
    <div class="tag">Build the fixture once — every app comes out the same.</div>
  </div>
</body></html>
