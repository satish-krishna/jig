<!-- @dsCard group="Colors" viewport="700x150" name="Actions" subtitle="primary · secondary · accent · destructive" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;display:flex;gap:12px;flex-wrap:wrap;font-family:var(--font-sans)}
  .sw{width:150px}
  .chip{height:52px;border-radius:var(--radius-md);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500}
  .n{font-size:12px;font-weight:500;margin-top:6px}
  .v{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);margin-top:1px}
</style></head><body>
  <div class="sw"><div class="chip" style="background:var(--primary);color:var(--primary-foreground)">Aa</div><div class="n">primary</div><div class="v">0.205 0 0</div></div>
  <div class="sw"><div class="chip" style="background:var(--secondary);color:var(--secondary-foreground)">Aa</div><div class="n">secondary</div><div class="v">0.97 0 0</div></div>
  <div class="sw"><div class="chip" style="background:var(--accent);color:var(--accent-foreground)">Aa</div><div class="n">accent</div><div class="v">0.97 0 0</div></div>
  <div class="sw"><div class="chip" style="background:var(--destructive);color:#fff">Aa</div><div class="n">destructive</div><div class="v">0.577 0.245 27</div></div>
</body></html>
