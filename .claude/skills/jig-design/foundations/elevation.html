<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;display:flex;gap:24px;font-family:var(--font-sans);background:var(--background)}
  .b{width:96px;height:60px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg)}
  .n{font-size:12px;font-weight:500;margin-top:10px}
  .c{text-align:center}
</style></head><body>
  <div class="c"><div class="b" style="box-shadow:var(--shadow-xs)"></div><div class="n">xs</div></div>
  <div class="c"><div class="b" style="box-shadow:var(--shadow-sm)"></div><div class="n">sm · cards</div></div>
  <div class="c"><div class="b" style="box-shadow:var(--shadow-md)"></div><div class="n">md</div></div>
  <div class="c"><div class="b" style="box-shadow:var(--shadow-lg)"></div><div class="n">lg · popovers</div></div>
  <div class="c"><div class="b" style="box-shadow:var(--shadow-xl)"></div><div class="n">xl · modals</div></div>
</body></html>
