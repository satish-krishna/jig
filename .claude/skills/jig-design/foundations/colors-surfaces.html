<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & text" subtitle="background · foreground · card · popover · muted" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;display:flex;gap:12px;flex-wrap:wrap;font-family:var(--font-sans)}
  .sw{width:150px}
  .chip{height:52px;border-radius:var(--radius-md);border:1px solid var(--border)}
  .n{font-size:12px;font-weight:500;margin-top:6px}
  .v{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);margin-top:1px}
</style></head><body>
  <div class="sw"><div class="chip" style="background:var(--background)"></div><div class="n">background</div><div class="v">oklch(1 0 0)</div></div>
  <div class="sw"><div class="chip" style="background:var(--foreground)"></div><div class="n">foreground</div><div class="v">0.145 0 0</div></div>
  <div class="sw"><div class="chip" style="background:var(--card)"></div><div class="n">card</div><div class="v">oklch(1 0 0)</div></div>
  <div class="sw"><div class="chip" style="background:var(--popover)"></div><div class="n">popover</div><div class="v">oklch(1 0 0)</div></div>
  <div class="sw"><div class="chip" style="background:var(--muted)"></div><div class="n">muted</div><div class="v">0.97 0 0</div></div>
</body></html>
