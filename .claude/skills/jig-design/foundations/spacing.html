<!-- @dsCard group="Spacing" viewport="700x230" name="Spacing scale" subtitle="app-authored 4px, 6-step grid · compact controls (h-8) · ADR 0011" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--foreground)}
  .group{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-foreground);margin:14px 0 6px}
  .group:first-child{margin-top:0}
  .r{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .bar{height:14px;background:var(--primary);border-radius:2px}
  .l{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);width:170px}
</style></head><body>
  <div class="group">App-authored (tokens/spacing.css, gated)</div>
  <div class="r"><span class="l">--spacing-xs · 4px</span><div class="bar" style="width:4px"></div></div>
  <div class="r"><span class="l">--spacing-s · 8px</span><div class="bar" style="width:8px"></div></div>
  <div class="r"><span class="l">--spacing-m · 12px</span><div class="bar" style="width:12px"></div></div>
  <div class="r"><span class="l">--spacing-l · 16px</span><div class="bar" style="width:16px"></div></div>
  <div class="r"><span class="l">--spacing-xl · 24px (card)</span><div class="bar" style="width:24px"></div></div>
  <div class="r"><span class="l">--spacing-2xl · 32px</span><div class="bar" style="width:32px"></div></div>
  <div class="group">Raw scale (--space-*, unrelated to the grid above, no snapping rule)</div>
  <div class="r"><span class="l">--space-2-5 · 10px</span><div class="bar" style="width:10px"></div></div>
</body></html>
