<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4px base unit · compact controls (h-8, px-2.5)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--foreground)}
  .r{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .bar{height:14px;background:var(--primary);border-radius:2px}
  .l{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);width:150px}
</style></head><body>
  <div class="r"><span class="l">--space-1 · 4px</span><div class="bar" style="width:4px"></div></div>
  <div class="r"><span class="l">--space-2 · 8px</span><div class="bar" style="width:8px"></div></div>
  <div class="r"><span class="l">--space-2-5 · 10px</span><div class="bar" style="width:10px"></div></div>
  <div class="r"><span class="l">--space-4 · 16px</span><div class="bar" style="width:16px"></div></div>
  <div class="r"><span class="l">--space-6 · 24px (card)</span><div class="bar" style="width:24px"></div></div>
  <div class="r"><span class="l">--space-8 · 32px</span><div class="bar" style="width:32px"></div></div>
</body></html>
