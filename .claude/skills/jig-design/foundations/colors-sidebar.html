<!-- @dsCard group="Colors" viewport="700x160" name="Sidebar family" subtitle="Dedicated surface tokens for the collapsible sidebar" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;display:flex;gap:12px;flex-wrap:wrap;font-family:var(--font-sans)}
  .sw{width:150px}
  .chip{height:52px;border-radius:var(--radius-md);border:1px solid var(--sidebar-border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500}
  .n{font-size:12px;font-weight:500;margin-top:6px}
  .v{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);margin-top:1px}
</style></head><body>
  <div class="sw"><div class="chip" style="background:var(--sidebar);color:var(--sidebar-foreground)">Aa</div><div class="n">sidebar</div><div class="v">0.985 0 0</div></div>
  <div class="sw"><div class="chip" style="background:var(--sidebar-primary);color:var(--sidebar-primary-foreground)">Aa</div><div class="n">sidebar-primary</div><div class="v">0.205 0 0</div></div>
  <div class="sw"><div class="chip" style="background:var(--sidebar-accent);color:var(--sidebar-accent-foreground)">Aa</div><div class="n">sidebar-accent</div><div class="v">0.97 0 0</div></div>
  <div class="sw"><div class="chip" style="background:var(--sidebar);border-color:var(--sidebar-border)"></div><div class="n">sidebar-border</div><div class="v">0.922 0 0</div></div>
</body></html>
